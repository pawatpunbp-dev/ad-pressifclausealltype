var COLORS=['#15803d','#1d4ed8','#7e22ce','#c2410c'];

function clean(t){return t.toLowerCase().replace(/[^a-z]/g,'');}
function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
var PHK=Object.keys(PH).sort(function(a,b){return b.length-a.length;});
var PHRE=new RegExp('\\b('+PHK.map(function(k){return k.replace(/[-]/g,'\\-');}).join('|')+')\\b','i');

/* ทำให้คำภาษาอังกฤษทุกคำกดได้ */
function words(s){
  return s.replace(/(\.{5,})|([A-Za-z]+(?:'[A-Za-z]+)?)|([^.A-Za-z]+|\.)/g,function(m,dots,w,other){
    if(dots)return '<span class="blank">'+dots+'</span>';
    if(w){
      if(w==='A'||!D[clean(w)])return esc(w);
      return '<span class="w" data-w="'+esc(w)+'">'+esc(w)+'</span>';
    }
    return esc(m);
  });
}
function plain(s){
  var out='',m;
  while((m=s.match(PHRE))){
    out+=words(s.slice(0,m.index))+'<span class="w ph" data-p="'+esc(m[0])+'">'+esc(m[0])+'</span>';
    s=s.slice(m.index+m[0].length);
  }
  return out+words(s);
}
function W(s){ /* รองรับตัวหนา **...** */
  return s.split('**').map(function(seg,i){return i%2?'<b>'+plain(seg)+'</b>':plain(seg);}).join('');
}

/* เสียง */
function speak(text,lang,rate){
  if(!('speechSynthesis' in window))return;
  try{speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=rate;
    var vs=speechSynthesis.getVoices(),p=lang.slice(0,2);
    for(var i=0;i<vs.length;i++){if(vs[i].lang.replace('_','-').toLowerCase().indexOf(p)===0){u.voice=vs[i];break;}}
    speechSynthesis.speak(u);}catch(e){}
}
function thSay(m){return m.replace(/\(.*?\)/g,'').replace(/,/g,' หรือ ');}
function row(en,d,cls){
  return '<div class="row'+(cls||'')+'"><div class="en">'+esc(en)+'</div>'+
   '<div>คำอ่าน: <b>'+esc(d[0])+'</b></div><div>คำแปล: <b>'+esc(d[1])+'</b></div>'+
   '<button class="say" data-say="'+esc(en)+'" data-lang="en">🔊 ฟังเสียง</button>'+
   '<button class="say" data-say="'+esc(en)+'" data-lang="en" data-slow="1">🐢 ช้า ๆ</button>'+
   '<button class="say th" data-say="'+esc(thSay(d[1]))+'" data-lang="th">🔊 ฟังคำแปล</button></div>';
}
var sheet=document.getElementById('sheet'),sheetIn=document.getElementById('sheetIn'),cur=null;
function phKey(p){for(var k in PH){if(k.toLowerCase()===p.toLowerCase())return k;}return null;}
function show(el){
  if(cur)cur.classList.remove('on');cur=el;el.classList.add('on');
  var h='<button class="x" data-close="1">✕</button>',say;
  if(el.dataset.p){
    var p=el.dataset.p,k=phKey(p);say=p;
    h+=row(p,PH[k],' ph');
    var seen={};
    (p.match(/[A-Za-z]+(?:'[A-Za-z]+)?/g)||[]).forEach(function(w){var c=clean(w);if(D[c]&&!seen[c]){seen[c]=1;h+=row(w,D[c]);}});
  }else{
    var w=el.dataset.w;say=el.dataset.say||w;h+=row(w,D[el.dataset.key||clean(w)]);
  }
  sheetIn.innerHTML=h;sheet.classList.add('on');sheet.scrollTop=0;
  speak(say,'en-US',0.8);
}
function hide(){sheet.classList.remove('on');if(cur){cur.classList.remove('on');cur=null;}}
document.addEventListener('click',function(e){
  var t=e.target.closest('.tab');if(t){render(+t.dataset.t);return;}
  var w=e.target.closest('.w');if(w){show(w);return;}
  var s=e.target.closest('.say');if(s){speak(s.dataset.say,s.dataset.lang==='th'?'th-TH':'en-US',s.dataset.slow?0.45:(s.dataset.lang==='th'?0.9:0.8));return;}
  if(e.target.closest('[data-close]')||!e.target.closest('#sheet'))hide();
});
if('speechSynthesis' in window){try{speechSynthesis.getVoices();}catch(e){}}

function render(t){
  hide();
  var L=SHEETS[t],h='',opts=[];
  function flush(){if(opts.length){h+='<div class="opts">'+opts.join('')+'</div>';opts=[];}}
  L.forEach(function(l){
    var k=l[0];
    if(k!=='opt')flush();
    if(k==='h1')h+='<h1>'+W(l[1])+'</h1>';
    else if(k==='name')h+='<div class="name"><span class="f n">'+W('Name')+'<i></i></span><span class="f"><span class="w" data-w="No." data-key="numabbr" data-say="number">No.</span><i></i></span><span class="f">'+W('Class')+'<i></i></span></div>';
    else if(k==='h2')h+='<h2><b>'+W(l[1])+'</b>'+(l[2]?' '+W(l[2]):'')+'</h2>';
    else if(k==='h3')h+='<h3>'+W(l[1])+'</h3>';
    else if(k==='formula')h+='<p class="formula">'+W(l[1])+'</p>';
    else if(k==='p')h+='<p>'+W(l[1])+'</p>';
    else if(k==='pi')h+='<p class="ind">'+W(l[1])+'</p>';
    else if(k==='li')h+='<div class="li"><span class="num">'+esc(l[1])+'.</span> '+W(l[2])+'</div>';
    else if(k==='line')h+='<div class="line"></div>';
    else if(k==='opt'){for(var i=1;i<l.length;i++){var m=l[i].match(/^([A-H])\.\s*(.*)$/);opts.push('<div><span class="k">'+m[1]+'.</span> '+W(m[2])+'</div>');}}
  });
  flush();
  var paper=document.getElementById('paper');
  paper.innerHTML=h;paper.style.setProperty('--tc',COLORS[t]);
  document.querySelectorAll('.tab').forEach(function(b){b.classList.toggle('on',b.dataset.t==t);});
  try{history.replaceState(null,'','#type'+t);}catch(e){}
  window.scrollTo(0,0);
}
var m=(location.hash||'').match(/type([0-3])/);render(m?+m[1]:0);
